---
# Copilot CLI: context-mode v2 has no Copilot plugin (upstream deleted the v1
# `configs/copilot-cli` bundle in 6eb1617e), so `context-mode setup` is the
# install path. It adds the MCP server to ~/.copilot/mcp-config.json, writes the
# hooks to ~/.copilot/hooks/context-mode.json and the /ctx-* skills, and checks
# them. A second run passes and changes nothing.

# Hosts provisioned before v2 still carry the v1 direct install.
- name: Remove the v1 context-mode Copilot CLI plugin
  ansible.builtin.command:
    cmd: copilot plugin uninstall context-mode
    removes: "{{ context_mode_copilot_dir }}"

# Setup writes absolute paths to the node and the package it ran from, so a new
# node under mise breaks them. Rerun it whenever the hook file does not name the
# package that `context-mode` resolves to now.
- name: Set up context-mode for Copilot CLI
  ansible.builtin.shell: |
    set -eu
    pkg=$(dirname "$(realpath "$(command -v context-mode)")")
    grep -qF "$pkg/hook.mjs" "{{ context_mode_copilot_hooks }}" 2>/dev/null && exit 0
    context-mode setup --yes --agents copilot-cli
    echo CONTEXT_MODE_SETUP_RAN
  register: context_mode_copilot_setup
  changed_when: "'CONTEXT_MODE_SETUP_RAN' in context_mode_copilot_setup.stdout"
