---
# OpenClaw: context-mode v2 dropped OpenClaw (upstream deleted docs/openclaw.md,
# and the 2.x npm package has no `openclaw.extensions`), so `openclaw plugins
# update context-mode` fails. The user chose to run OpenClaw without
# context-mode, so this half only removes the v1 plugin where it is still
# installed. OpenClaw lists plugins only once `cliproxy-tier <host>` has
# onboarded it, so a host without ~/.openclaw/openclaw.json is skipped.
- name: Check whether OpenClaw is onboarded
  ansible.builtin.stat:
    path: "{{ context_mode_home }}/.openclaw/openclaw.json"
  register: context_mode_openclaw_config

- name: Remove context-mode from OpenClaw
  when: context_mode_openclaw_config.stat.exists
  block:
    - name: List OpenClaw plugins
      ansible.builtin.command: openclaw plugins list --json
      register: context_mode_openclaw_plugins
      changed_when: false
      check_mode: false

    - name: Uninstall the v1 context-mode OpenClaw plugin
      ansible.builtin.command: openclaw plugins uninstall context-mode --force
      when: >-
        (context_mode_openclaw_plugins.stdout | from_json).plugins
        | selectattr('id', 'equalto', 'context-mode') | list | length > 0
      changed_when: true
