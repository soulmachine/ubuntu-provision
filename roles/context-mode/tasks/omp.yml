---
# oh-my-pi: upstream's recommended path. The npm package declares a `pi`
# manifest key (`pi.extensions`), and v2's extension serves the ctx_* tools in
# process, with no MCP server. omp `bun install`s it into
# ~/.omp/plugins (package.json + node_modules) and records it in
# omp-plugins.lock.json there. `omp plugin list --json` prints
# `{"npm": [{name, version, enabled, …}], "marketplace": […]}`: the names gate
# the install and the version is the state the upgrade gate reads.
- name: List oh-my-pi plugins
  ansible.builtin.command: "{{ context_mode_home }}/.bun/bin/omp plugin list --json"
  environment:
    PATH: "{{ context_mode_home }}/.bun/bin:{{ lookup('env', 'PATH') }}"
  register: context_mode_omp_list
  changed_when: false
  check_mode: false

# Refresh path. `omp plugin upgrade` takes only `name@marketplace` IDs — an npm
# spec errors `Invalid plugin ID … Expected "name@marketplace"` — and the
# package is pinned `^x.y.z` in ~/.omp/plugins/package.json, so nothing in omp
# re-resolves an npm plugin. Re-running `omp plugin install` is that path: its
# install() is `bun install <spec>` in the plugins dir, which bumps the pin to
# the newest release. It also rewrites the plugin's runtime entry to
# `enabled: true` with default features, so it must run only when there is a
# release to move to: the gate compares the installed version with the
# registry's, the same shape the claude-mem role uses (`npm view … version`).
# The registry is the observable state here — omp's list reports no
# "outdated" field. A manual `omp plugin disable` therefore survives every
# converged run and is undone only by an upgrade; noted, accepted.
- name: Get the latest published context-mode version
  ansible.builtin.command: npm view {{ context_mode_npm_package }} version
  register: context_mode_omp_latest
  changed_when: false
  check_mode: false

- name: Install or upgrade the context-mode oh-my-pi plugin
  ansible.builtin.command: "{{ context_mode_home }}/.bun/bin/omp plugin install {{ context_mode_npm_package }}"
  environment:
    PATH: "{{ context_mode_home }}/.bun/bin:{{ lookup('env', 'PATH') }}"
  vars:
    context_mode_omp_installed: >-
      {{ (context_mode_omp_list.stdout | from_json).npm
         | selectattr('name', 'equalto', context_mode_npm_package) | map(attribute='version') | list }}
  when: context_mode_omp_installed != [context_mode_omp_latest.stdout | trim]
  changed_when: true

# v1 registered an MCP server in ~/.omp/agent/mcp.json on first load, pointing at
# its server.bundle.mjs. v2 has no such file, so the entry fails at every omp
# start ("MCP server context-mode failed to connect"). Remove only that v1 entry.
- name: Read the oh-my-pi MCP config
  ansible.builtin.slurp:
    src: "{{ context_mode_home }}/.omp/agent/mcp.json"
  register: context_mode_omp_mcp_raw
  failed_when: false
  no_log: true

- name: Remove the v1 context-mode MCP server from oh-my-pi
  ansible.builtin.copy:
    dest: "{{ context_mode_home }}/.omp/agent/mcp.json"
    content: "{{ context_mode_omp_mcp | combine({'mcpServers': context_mode_omp_kept}) | to_nice_json(indent=2) }}\n"
    mode: "0600"
  no_log: true
  vars:
    context_mode_omp_mcp: "{{ context_mode_omp_mcp_raw.content | b64decode | from_json }}"
    context_mode_omp_servers: "{{ context_mode_omp_mcp.get('mcpServers', {}) }}"
    context_mode_omp_kept: "{{ context_mode_omp_servers | dict2items | rejectattr('key', 'equalto', 'context-mode') | items2dict }}"
  when:
    - context_mode_omp_mcp_raw.content is defined
    - "'server.bundle.mjs' in (context_mode_omp_servers.get('context-mode', {}).get('args', []) | join(' '))"
