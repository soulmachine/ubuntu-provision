---
# pi: `pi install npm:context-mode` npm-installs the package into ~/.pi/agent/npm
# and appends the source string, verbatim, to `packages` in
# ~/.pi/agent/settings.json. The pi role copies roles/pi/files/agent/
# settings.json over that file on every run, so the SAME bare string is listed
# there, or each pi run would drop the entry. Unpinned on purpose: the refresh
# below tracks upstream. No ~/.pi/agent/mcp.json: the extension registers the
# ctx_* tools itself through its MCP bridge (src/adapters/pi/mcp-bridge.ts).
#
# `chdir` to $HOME keeps any project-local .pi/ out of the picture; the PATH is
# for pi's npm/bun calls.
- name: Install the context-mode pi package
  ansible.builtin.command:
    cmd: "{{ context_mode_home }}/.bun/bin/pi install {{ context_mode_pi_source }}"
    chdir: "{{ context_mode_home }}"
    creates: "{{ context_mode_pi_dir }}"
  environment:
    PATH: "{{ context_mode_home }}/.bun/bin:{{ lookup('env', 'PATH') }}"

# Refresh: `pi update --extension <source>` re-resolves an unpinned npm package
# and exits 0 whether or not anything moved, so diff the installed version.
# Gated on the package existing, which it does not under `--check` on a fresh
# host.
- name: Check whether the context-mode pi package is present
  ansible.builtin.stat:
    path: "{{ context_mode_pi_dir }}/package.json"
  register: context_mode_pi_stat

- name: Refresh the context-mode pi package
  when: context_mode_pi_stat.stat.exists
  block:
    - name: Read the context-mode pi package before updating
      ansible.builtin.slurp:
        src: "{{ context_mode_pi_dir }}/package.json"
      register: context_mode_pi_before

    - name: Update the context-mode pi package
      ansible.builtin.command:
        cmd: "{{ context_mode_home }}/.bun/bin/pi update --extension {{ context_mode_pi_source }}"
        chdir: "{{ context_mode_home }}"
      environment:
        PATH: "{{ context_mode_home }}/.bun/bin:{{ lookup('env', 'PATH') }}"
      changed_when: false

    - name: Read the context-mode pi package after updating
      ansible.builtin.slurp:
        src: "{{ context_mode_pi_dir }}/package.json"
      register: context_mode_pi_after
      changed_when: >-
        (context_mode_pi_before.content | b64decode | from_json).version
        != (context_mode_pi_after.content | b64decode | from_json).version
