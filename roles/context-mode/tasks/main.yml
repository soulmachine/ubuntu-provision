---
# context-mode — https://github.com/mksglu/context-mode — is retired fleet-wide: Claude
# Code's code mode (CLAUDE_CODE_EXPERIMENTAL_CODE_MODE, the claude-code role) takes over its
# job. This is a removal role. It takes context-mode out of every agent the old role put it
# into, each step a no-op on a clean host, then fails if anything is left. Delete the role
# once every host passes.

# Claude Code: uninstall the plugin, then drop its marketplace. Both gates read the
# ledgers Claude Code keeps, so a clean host skips the CLI calls.
- name: Read the Claude Code plugin ledgers
  ansible.builtin.slurp:
    src: "{{ context_mode_home }}/.claude/plugins/{{ item }}"
  loop: [installed_plugins.json, known_marketplaces.json]
  register: context_mode_claude_ledgers
  failed_when: false

- name: Uninstall the context-mode Claude Code plugin
  ansible.builtin.command: claude plugin uninstall {{ context_mode_plugin }}
  when: >-
    context_mode_plugin in
    (context_mode_claude_ledgers.results[0].content | default('e30=') | b64decode | from_json).get('plugins', {})
  changed_when: true

- name: Remove the context-mode Claude Code marketplace
  ansible.builtin.command: claude plugin marketplace remove {{ context_mode_marketplace }}
  when: >-
    context_mode_marketplace in
    (context_mode_claude_ledgers.results[1].content | default('e30=') | b64decode | from_json)
  changed_when: true

# Codex records both in config.toml, which carries API keys, hence no_log.
- name: Read the Codex config
  ansible.builtin.slurp:
    src: "{{ context_mode_home }}/.codex/config.toml"
  register: context_mode_codex_config_raw
  failed_when: false
  no_log: true

- name: Remove the context-mode Codex plugin and marketplace
  ansible.builtin.command: "{{ item.cmd }}"
  timeout: 120
  loop:
    - {marker: '[plugins."{{ context_mode_plugin }}"]', cmd: "codex plugin remove {{ context_mode_plugin }}"}
    - {marker: "[marketplaces.{{ context_mode_marketplace }}]", cmd: "codex plugin marketplace remove {{ context_mode_marketplace }}"}
  loop_control:
    label: "{{ item.cmd }}"
  when: item.marker in (context_mode_codex_config_raw.content | default('') | b64decode)
  changed_when: true

# OpenCode's plugin list and the Copilot and kimi-code MCP servers. The files carry API
# keys; the script never prints them and keeps each file's 0600.
- name: Remove context-mode from the OpenCode, Copilot and kimi-code configs
  ansible.builtin.command: >-
    python3 {{ role_path }}/files/strip-context-mode.py{{ ' --check' if ansible_check_mode else '' }}
  register: context_mode_strip
  changed_when: context_mode_strip.stdout | length > 0
  check_mode: false

- name: Delete the plugin caches and Copilot CLI files context-mode left
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ context_mode_leftovers }}"

# pi: the pi role, which runs first, already dropped npm:context-mode from settings.json,
# so `pi remove` no longer knows the package; npm removes it from pi's prefix.
- name: Uninstall the context-mode pi package
  ansible.builtin.command:
    cmd: npm uninstall --prefix {{ context_mode_pi_prefix }} context-mode
    removes: "{{ context_mode_pi_prefix }}/node_modules/context-mode"

- name: List oh-my-pi plugins
  ansible.builtin.command: "{{ context_mode_home }}/.bun/bin/omp plugin list --json"
  register: context_mode_omp_plugins
  failed_when: false
  changed_when: false
  check_mode: false

- name: Uninstall the context-mode oh-my-pi plugin
  ansible.builtin.command: "{{ context_mode_home }}/.bun/bin/omp plugin uninstall context-mode"
  when:
    - context_mode_omp_plugins.rc == 0
    - >-
      (context_mode_omp_plugins.stdout | from_json).npm
      | selectattr('name', 'equalto', 'context-mode') | list | length > 0
  changed_when: true

# openclaw.yml skips a host with no ~/.openclaw/openclaw.json.
- name: Remove context-mode from OpenClaw
  ansible.builtin.include_tasks: openclaw.yml

# Last: the hooks removed above called this CLI. A mise Node upgrade strands npm globals on
# the old Node rather than deleting them, so clean every install, not only the active one;
# `mise reshim` then drops the shim.
- name: Uninstall the global context-mode CLI from every mise Node
  ansible.builtin.shell: |
    set -eu
    for d in {{ context_mode_node_installs }}/*/; do
      [ -L "${d%/}" ] || [ ! -e "${d}lib/node_modules/context-mode" ] && continue
      npm uninstall -g --prefix "$d" context-mode
      echo "removed ${d}"
    done
    mise reshim
  register: context_mode_cli
  changed_when: "'removed ' in context_mode_cli.stdout"

- name: Look for anything context-mode left behind
  ansible.builtin.shell: |
    grep -ls '"context-mode@context-mode"' {{ context_mode_home }}/.claude/plugins/installed_plugins.json
    grep -ls 'plugins."context-mode@context-mode"' {{ context_mode_home }}/.codex/config.toml
    python3 {{ role_path }}/files/strip-context-mode.py --check
    for p in {{ context_mode_leftovers | join(' ') }} \
        {{ context_mode_pi_prefix }}/node_modules/context-mode \
        {{ context_mode_home }}/.omp/plugins/node_modules/context-mode \
        {{ context_mode_node_installs }}/*/lib/node_modules/context-mode; do
      [ -e "$p" ] && echo "$p"
    done
    true
  register: context_mode_left
  changed_when: false
  check_mode: false

- name: Fail if context-mode is not fully gone
  ansible.builtin.fail:
    msg: "context-mode is still present: {{ context_mode_left.stdout_lines }}"
  when: context_mode_left.stdout | length > 0 and not ansible_check_mode
