---
# kimi-code has no plugin or MCP command, so upstream's path is two files:
# the MCP server in ~/.kimi-code/mcp.json and six `[[hooks]]` tables in
# ~/.kimi-code/config.toml. context-mode v2 dropped kimi-code: its hooks
# answer `unknown hook platform "kimi"`, and a bare `context-mode` prints usage.
# So kimi gets only v2's generic MCP server, `context-mode server`, and the role
# removes the v1 hook block.
#
# mcp.json: jev-register-agents writes the same `mcpServers` shape and keeps
# entries it does not own. Read → add → write, gated on the key, at 0600 under
# no_log because its env blocks hold API keys.
- name: Read the kimi-code MCP config
  ansible.builtin.slurp:
    src: "{{ context_mode_home }}/.kimi-code/mcp.json"
  register: context_mode_kimi_mcp_raw
  failed_when: false
  no_log: true

- name: Parse the kimi-code MCP config
  ansible.builtin.set_fact:
    context_mode_kimi_mcp: >-
      {{ (context_mode_kimi_mcp_raw.content | b64decode | from_json)
         if (context_mode_kimi_mcp_raw.content | default('') | b64decode | trim | length > 0)
         else {} }}
  no_log: true

- name: Register the context-mode MCP server with kimi-code
  ansible.builtin.copy:
    dest: "{{ context_mode_home }}/.kimi-code/mcp.json"
    content: "{{ context_mode_kimi_mcp_merged | to_nice_json(indent=2) }}\n"
    mode: "0600"
  no_log: true
  vars:
    context_mode_kimi_mcp_merged: >-
      {{ context_mode_kimi_mcp
         | combine({'mcpServers': {'context-mode': context_mode_kimi_server}}, recursive=true) }}
    context_mode_kimi_server: {command: context-mode, args: [server]}
  when: (context_mode_kimi_mcp.mcpServers | default({}))['context-mode'] | default({}) != context_mode_kimi_server

# config.toml: remove the v1 hook block; v2 has no kimi hook platform.
- name: Remove the v1 context-mode hooks from kimi-code
  ansible.builtin.blockinfile:
    path: "{{ context_mode_home }}/.kimi-code/config.toml"
    marker: "# {mark} context-mode hooks (managed by ubuntu-provision)"
    state: absent

# Some hosts also hold an unmarked copy of the same tables. Drop every table in
# the exact shape the role wrote; other tools' hooks (herdr's) stay.
- name: Remove unmarked v1 context-mode hooks from kimi-code
  ansible.builtin.replace:
    path: "{{ context_mode_home }}/.kimi-code/config.toml"
    regexp: '^\[\[hooks\]\]\nevent = "[A-Za-z]+"\n(?:matcher = "[^"\n]*"\n)?command = "context-mode hook kimi [a-z]+"\ntimeout = \d+\n\n?'
    replace: ""
