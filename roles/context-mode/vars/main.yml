---
context_mode_home: "{{ lookup('env', 'HOME') }}"

# Claude Code and Codex: plugin `context-mode` in the marketplace named `context-mode`.
context_mode_plugin: context-mode@context-mode
context_mode_marketplace: context-mode

# pi installs its npm packages under this prefix (roles/pi/vars/main.yml `pi_npm_dir`).
context_mode_pi_prefix: "{{ context_mode_home }}/.pi/agent/npm"

# Folders the uninstallers leave behind: the Claude Code and Codex plugin caches (every old
# version stays, ~200 MB), and what `context-mode setup --agents copilot-cli` wrote outside
# ~/.copilot/mcp-config.json.
context_mode_leftovers:
  - "{{ context_mode_home }}/.claude/plugins/cache/context-mode"
  - "{{ context_mode_home }}/.codex/plugins/cache/context-mode"
  - "{{ context_mode_home }}/.copilot/hooks/context-mode.json"
  - "{{ context_mode_home }}/.copilot/skills/ctx-doctor"
  - "{{ context_mode_home }}/.copilot/skills/ctx-stats"
  - "{{ context_mode_home }}/.copilot/skills/ctx-upgrade"
  # The v1 direct install, on hosts provisioned before v2.
  - "{{ context_mode_home }}/.copilot/installed-plugins/_direct/mksglu--context-mode--configs-copilot-cli"

# The global CLI is an npm global of each Node that mise installed.
context_mode_node_installs: "{{ context_mode_home }}/.local/share/mise/installs/node"
