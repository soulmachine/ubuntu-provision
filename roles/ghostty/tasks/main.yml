---
# Ghostty is a GUI terminal emulator — skipped on the headless server profile.
# Ghostty supports Linux but has no official apt package; build from source or use
# a community package per https://ghostty.org/docs/install . The macOS config is
# kept in files/config for reference. To enable on an Ubuntu desktop, install
# Ghostty, then uncomment the config-deploy tasks below:
#
#   - name: Ensure ~/.config/ghostty exists
#     ansible.builtin.file:
#       path: "{{ lookup('env', 'HOME') }}/.config/ghostty"
#       state: directory
#       mode: "0755"
#   - name: Deploy Ghostty config
#     ansible.builtin.copy:
#       src: config
#       dest: "{{ lookup('env', 'HOME') }}/.config/ghostty/config"
#       mode: "0644"
- name: Skip Ghostty (GUI terminal, headless profile)
  ansible.builtin.debug:
    msg: "Ghostty is a GUI terminal; skipped on headless Ubuntu (see role comment + files/config to enable)."
