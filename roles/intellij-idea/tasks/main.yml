---
# IntelliJ IDEA is a GUI desktop IDE — skipped on the headless server profile.
# To install it on an Ubuntu desktop, uncomment the snap task below (JetBrains
# publishes official snaps; --classic is required for full filesystem access).
# Requires the community.general.snap module and snapd present on the host.
#
#   - name: Install IntelliJ IDEA
#     become: true
#     community.general.snap:
#       name: intellij-idea-community   # or intellij-idea-ultimate
#       classic: true
- name: Skip IntelliJ IDEA (GUI desktop IDE, headless profile)
  ansible.builtin.debug:
    msg: "IntelliJ IDEA is a GUI IDE; skipped on headless Ubuntu (see role comment to enable via snap)."
