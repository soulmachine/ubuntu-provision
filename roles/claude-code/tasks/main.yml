---
- name: Install Claude Code # noqa: command-instead-of-module risky-shell-pipe
  check_mode: false
  ansible.builtin.shell: curl -fsSL https://claude.ai/install.sh | bash
  args:
    creates: "{{ lookup('env', 'HOME') }}/.local/bin/claude"

- name: Update Claude Code to the latest version
  check_mode: false
  ansible.builtin.command: claude update
  register: claude_code_self_update
  changed_when: "'Claude Code is up to date' not in claude_code_self_update.stdout"

- name: Add ccd alias to .zshrc
  ansible.builtin.lineinfile:
    path: "{{ lookup('env', 'HOME') }}/.zshrc"
    line: 'alias ccd="claude --dangerously-skip-permissions --effort max"'
    regexp: '^alias ccd='
    state: present

- name: Check installed plugins
  ansible.builtin.slurp:
    src: "{{ lookup('env', 'HOME') }}/.claude/plugins/installed_plugins.json"
  register: claude_code_plugins_raw
  failed_when: false

- name: Decode installed plugins
  ansible.builtin.set_fact:
    claude_code_plugins_content: "{{ (claude_code_plugins_raw.content | default('') | b64decode) if claude_code_plugins_raw is succeeded else '' }}"

# Read claude code settings
- name: Ensure ~/.claude directory exists
  ansible.builtin.file:
    path: "{{ lookup('env', 'HOME') }}/.claude"
    state: directory
    mode: "0755"

- name: Read existing Claude Code settings
  ansible.builtin.slurp:
    src: "{{ lookup('env', 'HOME') }}/.claude/settings.json"
  register: claude_code_settings_raw
  failed_when: false

- name: Parse existing Claude Code settings
  ansible.builtin.set_fact:
    claude_code_settings: "{{ (claude_code_settings_raw.content | b64decode | from_json) if claude_code_settings_raw.content is defined else {} }}"

- name: Add plugin marketplaces
  check_mode: false
  ansible.builtin.command: claude plugin marketplace add {{ item }}
  loop:
    - anthropics/claude-plugins-official # https://claude.com/plugins
    - OthmanAdi/planning-with-files
    - thedotmack/claude-mem
    - forrestchang/andrej-karpathy-skills
    - swe-workflow/swe-workflow
    - veelenga/claude-mermaid
  register: claude_code_mp
  changed_when: "'already' not in claude_code_mp.stdout"

- name: Install plugins
  check_mode: false
  ansible.builtin.command: claude plugin install {{ item }}
  loop:
    - frontend-design@claude-plugins-official
    - feature-dev@claude-plugins-official
    - planning-with-files@planning-with-files
    - claude-mem@thedotmack
    - andrej-karpathy-skills@karpathy-skills
    - swe-workflow@swe-workflow
    - claude-mermaid@claude-mermaid
  when: "item not in claude_code_plugins_content"
  changed_when: true

- name: Update plugins to the latest version
  check_mode: false
  ansible.builtin.command: claude plugin update {{ item }}
  loop:
    - frontend-design@claude-plugins-official
    - feature-dev@claude-plugins-official
    - planning-with-files@planning-with-files
    - claude-mem@thedotmack
    - andrej-karpathy-skills@karpathy-skills
    - swe-workflow@swe-workflow
    - claude-mermaid@claude-mermaid
  register: claude_code_update
  # Two no-op outcomes: versioned plugins print "already at the latest version";
  # unversioned ones (version "unknown", e.g. frontend-design/feature-dev) can't
  # report a version so they always print "refreshed from source" instead. Neither
  # is a real change — treat both as unchanged so re-runs report changed=0.
  changed_when:
    - "'already' not in claude_code_update.stdout"
    - "'refreshed from source' not in claude_code_update.stdout"

- name: Check if Claude Code Bridge is installed
  ansible.builtin.stat:
    path: "{{ lookup('env', 'HOME') }}/.local/bin/ccb"
    follow: true
  register: ccb_installed

# Claude Code Bridge (CCB) ships a prebuilt Linux release only for x86_64/amd64
# (the tarball bundles a prebuilt `ccb-agent-sidebar`, so no Rust toolchain is
# needed). There is no arm64 Linux asset, so CCB is gated to amd64 here and
# skipped with a note on other architectures.
- name: Set up Claude Code Bridge (amd64 Linux only)
  when: ansible_facts['architecture'] == 'x86_64'
  check_mode: false
  block:
    - name: Check Claude Code Bridge for updates
      ansible.builtin.command: ccb version
      register: ccb_version
      changed_when: false
      failed_when: false
      when: ccb_installed.stat.exists

    # Install from the official release tarball, NOT a git clone. A git-checkout
    # `install.sh install` runs in "source dev mode", which compiles the Rust
    # `ccb-agent-sidebar` helper locally and so demands a cargo/rustc toolchain.
    # The Linux release asset (ccb-linux-x86_64.tar.gz) bundles a prebuilt
    # `bin/ccb-agent-sidebar`, so install.sh links it instead of building and needs
    # no Rust. GitHub's /releases/latest/download/ URL always 302s to the newest
    # stable asset, so this auto-tracks releases without hitting the API.
    # CCB_CONFIRM_MAJOR_UPGRADE=1 auto-accepts breaking major bumps install.sh
    # otherwise refuses non-interactively. Idempotent: gated on a missing install
    # or `ccb version` reporting an update (matched case-insensitively); after
    # installing, `ccb version` reports "Up to date" and the block is skipped.
    # Repo note: bfly123/claude_code_bridge was transferred to
    # SeemSeam/claude_codex_bridge; we target the canonical URL directly.
    - name: Install or update Claude Code Bridge
      when: >-
        not ccb_installed.stat.exists
        or 'update available' in (ccb_version.stdout | default('') | lower)
      block:
        # Extract into a dedicated staging dir, NOT /tmp: the release tarball may
        # bundle a copy of itself at archive root, so unpacking alongside the
        # source archive could make tar refuse to overwrite it. The download is
        # named download.tar.gz so it can't collide with that member.
        - name: Create Claude Code Bridge staging directory
          ansible.builtin.file:
            path: /tmp/ccb-release
            state: directory
            mode: "0755"
        - name: Download Claude Code Bridge release tarball
          ansible.builtin.get_url:
            url: https://github.com/SeemSeam/claude_codex_bridge/releases/latest/download/ccb-linux-x86_64.tar.gz
            dest: /tmp/ccb-release/download.tar.gz
            mode: "0644"
            force: true
        # GNU tar is the default on Ubuntu, so ansible.builtin.unarchive would work
        # too; we use the command form to keep the extraction explicit and avoid a
        # re-download check against an unknown bundled member.
        - name: Extract Claude Code Bridge release tarball # noqa: command-instead-of-module
          ansible.builtin.command: tar -xzf download.tar.gz
          args:
            chdir: /tmp/ccb-release
          changed_when: true
        # The tarball may place install.sh at the archive root or under a top-level
        # directory; locate it rather than hardcoding the layout.
        - name: Locate the Claude Code Bridge installer
          ansible.builtin.command: find /tmp/ccb-release -maxdepth 2 -name install.sh -type f
          register: ccb_installer
          changed_when: false
        - name: Run Claude Code Bridge installer
          ansible.builtin.command: ./install.sh install
          args:
            chdir: "{{ ccb_installer.stdout_lines[0] | dirname }}"
          environment:
            CCB_CONFIRM_MAJOR_UPGRADE: "1"
          changed_when: true
      always:
        - name: Remove Claude Code Bridge staging directory
          ansible.builtin.file:
            path: /tmp/ccb-release
            state: absent

- name: Note Claude Code Bridge skipped on non-amd64
  ansible.builtin.debug:
    msg: "Claude Code Bridge ships no Linux {{ ansible_facts['architecture'] }} release (amd64 only); skipped."
  when: ansible_facts['architecture'] != 'x86_64'

- name: Disable Co-Authored-By in commits
  ansible.builtin.copy:
    dest: "{{ lookup('env', 'HOME') }}/.claude/settings.json"
    content: "{{ claude_code_settings | combine({'attribution': {'commit': ''}}) | to_nice_json }}\n"
    mode: "0644"
  when: (claude_code_settings.attribution.commit | default(none)) != ''

- name: Re-read Claude Code settings
  ansible.builtin.slurp:
    src: "{{ lookup('env', 'HOME') }}/.claude/settings.json"
  register: claude_code_settings_raw
  failed_when: false

- name: Re-parse Claude Code settings
  ansible.builtin.set_fact:
    claude_code_settings: "{{ (claude_code_settings_raw.content | b64decode | from_json) if claude_code_settings_raw.content is defined else {} }}"

- name: Enable Remote Control for all sessions
  ansible.builtin.copy:
    dest: "{{ lookup('env', 'HOME') }}/.claude/settings.json"
    content: "{{ claude_code_settings | combine({'remoteControlAtStartup': true}) | to_nice_json }}\n"
    mode: "0644"
  when: (claude_code_settings.remoteControlAtStartup | default(false)) != true

# `claude plugin install` adds a plugin to ~/.claude/plugins/installed_plugins.json
# but does NOT add it to `enabledPlugins` in ~/.claude/settings.json, and only
# enabled plugins appear in `/plugin`. So we explicitly enable each one. Gate on
# key absence (not value), so a user's manual `/plugin` disable is respected on
# re-runs. Runs last so the earlier shallow-merge writes can't clobber the
# enabledPlugins map.
- name: Enable plugins
  check_mode: false
  ansible.builtin.command: claude plugin enable {{ item }}
  loop:
    - frontend-design@claude-plugins-official
    - feature-dev@claude-plugins-official
    - planning-with-files@planning-with-files
    - claude-mem@thedotmack
    - andrej-karpathy-skills@karpathy-skills
    - swe-workflow@swe-workflow
    - claude-mermaid@claude-mermaid
  when: "item not in (claude_code_settings.enabledPlugins | default({}))"
  changed_when: true
