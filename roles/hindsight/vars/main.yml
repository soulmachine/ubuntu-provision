---
# The fleet's Hindsight memory server runs on mac-mini-m2 (~/coding-agent/devops/hindsight-server,
# coding-agent Q605–Q611). This role wires every agent CLI on a host to it. Same file in
# macbook-provision, ubuntu-provision and omarchy-provision.
hindsight_home: "{{ lookup('env', 'HOME') }}"
hindsight_package: "@vectorize-io/hindsight-coding-agents"
hindsight_dir: "{{ hindsight_home }}/.hindsight"
hindsight_mcp_server: "{{ hindsight_dir }}/coding-agents/dist/mcp-server.js"

# Keyed by ansible_hostname (`hostname -s`). A host not listed is not wired.
#  - m2 itself: loopback.
#  - same tailnet and same LAN as m2 (hindsight_lan_hosts): m2's mDNS name (coding-agent
#    Q858). It needs the Local Network exceptions below on the Macs.
#  - same tailnet, not on the LAN: Tailscale (coding-agent Q821).
#  - remote: the local hindsight-relay below, which tries Tailscale, then m2's reverse SSH tunnel.
#    dev-server-frank-lume is one: ts.net names only, and it has no route to m2 (coding-agent Q862).
hindsight_mdns_url: http://mac-mini-m2.local:8888
# The four hosts that never leave Frank's LAN, and their LAN IPs. ssh and the
# services between them go by .local (coding-agent Q858), so a LAN Mac lets every process reach each IP through
# Local Network privacy: m6's openroutine ssh to the Studio and omarchy failed with "No route to
# host" until these were allowed (coding-agent Q810).
hindsight_lan_hosts: [mac-mini-m2, mac-mini-m6, mac-studio-m3, mac-mini-2018-omarchy]
hindsight_lan_peers: [192.168.31.20, 192.168.31.81, 192.168.31.31, 192.168.31.34]
hindsight_relay_url: http://127.0.0.1:8888
hindsight_tailscale_url: http://mac-mini-m2.tail6a15b.ts.net:8888
hindsight_url_by_host:
  mac-mini-m2: http://127.0.0.1:8888
  mac-mini-m6: "{{ hindsight_mdns_url }}"
  mac-mini-2018-omarchy: "{{ hindsight_mdns_url }}"
  mac-studio-m3: "{{ hindsight_mdns_url }}"
  dev-server-frank-lume: "{{ hindsight_relay_url }}"
  macbook-pro-m3: "{{ hindsight_tailscale_url }}"
  franks-macbook-pro: "{{ hindsight_relay_url }}"  # macbook-pro-nickel
  archs-mac-mini: "{{ hindsight_relay_url }}"
  supermicro: "{{ hindsight_tailscale_url }}"

# Relays on the remote hosts, one per service on m2 (fleet rule: coding-agent
# devops/infra-architecture.html). Each listens on 127.0.0.1:<port> and tries the Tailscale MagicDNS name
# first, then the reverse tunnel m2 keeps on that host (me.soulmachine.hindsight-tunnel.<host>,
# com.cliproxy.tunnel.<host>). The full name, because a host on another tailnet (archs-mac-mini)
# cannot resolve the short one; archs has no tunnel (coding-agent Q815, Q816). The binary is
# generic; its name is historical.
hindsight_relays:
  - {name: hindsight, port: 8888, upstreams: [mac-mini-m2.tail6a15b.ts.net:8888, 127.0.0.1:18888]}
  - {name: cliproxy, port: 8317, upstreams: [mac-mini-m2.tail6a15b.ts.net:8317, 127.0.0.1:18317]}
# Relays a host does not get, by ansible_hostname. archs-mac-mini's CLIs call the gateway at
# http://mac-mini-m2.tail6a15b.ts.net:8317 (CLIPROXY_BASE_URL) directly: with no tunnel, the relay
# adds nothing (coding-agent Q820).
hindsight_relays_skip:
  archs-mac-mini: [cliproxy]
  # Its gateway tunnel already listens on 127.0.0.1:8317 (cliproxyapi/tunnels.sh, coding-agent Q632).
  dev-server-frank-lume: [cliproxy]

# Agents the installer wires itself (`install all`). Each line is a config file the install writes
# its path into. A file that does not exist means the agent is not installed here, so it is skipped.
hindsight_installer_markers:
  - .claude/settings.json
  - .codex/config.toml
  - .config/opencode/opencode.json
  - .kimi-code/config.toml
  - .copilot/mcp-config.json
  - .grok/config.toml
  - .pi/agent/settings.json

# Agents the installer does not cover get the installer's own stdio MCP server. It reads the URL
# and token from ~/.hindsight/coding-agent.json and picks the repo's bank from the working
# directory, so no token goes into these configs. HINDSIGHT_MCP_HARNESS names the caller.
# openclaw is left out: cliproxy-tier owns its config, and it is not a coding agent.
hindsight_cli_agents:
  - exe: gemini
    config: .gemini/settings.json
    remove: gemini mcp remove --scope user hindsight
    add: >-
      gemini mcp add --scope user -e HINDSIGHT_MCP_HARNESS=gemini hindsight node {{ hindsight_mcp_server }}
  # hermes asks "Enable all N tools?"; the stdin answers yes.
  - exe: hermes
    config: .hermes/config.yaml
    remove: hermes mcp remove hindsight
    add: >-
      hermes mcp add hindsight --command node --env HINDSIGHT_MCP_HARNESS=hermes
      --connect-timeout 20 --args {{ hindsight_mcp_server }}
    stdin: "y"
hindsight_json_agents:
  - dir: .omp/agent
    file: mcp.json
    key: mcpServers
    entry: {type: stdio, command: node, args: ["{{ hindsight_mcp_server }}"], env: {HINDSIGHT_MCP_HARNESS: omp}}
  - dir: .config/crush
    file: crush.json
    key: mcp
    entry: {type: stdio, command: node, args: ["{{ hindsight_mcp_server }}"], env: {HINDSIGHT_MCP_HARNESS: crush}}

# The folders whose .envrc sets the Hindsight bank channel: where their repos are hosted (coding-agent
# Q1026, Q1038). ~/coding-agent also carries its .envrc in git; the .gitignore of ~/personal-agent and
# ~/.agents covers it, so this list is the source there.
hindsight_channel_dirs:
  - {dir: github.com, channel: github.com}
  - {dir: git.soulmachine.io, channel: git.soulmachine.io}
  - {dir: coding-agent, channel: git.soulmachine.io}
  - {dir: personal-agent, channel: git.soulmachine.io}
  - {dir: .agents, channel: git.soulmachine.io}

# Extra channel folders for one host (key: ansible_facts hostname), added to the list above.
# archs-mac-mini works for ArchAuto-Tech; its other clones stay on github.com (coding-agent Q1052).
hindsight_channel_dirs_by_host:
  archs-mac-mini:
    - {dir: github.com/ArchAuto-Tech, channel: archauto.com}
