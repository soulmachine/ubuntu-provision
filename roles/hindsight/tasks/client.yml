---
- name: Set this host's Hindsight URL
  ansible.builtin.set_fact:
    _hindsight_url: "{{ hindsight_url_by_host[ansible_facts['hostname']] }}"

# A .local name resolves to IPv6 link-local first, and a zoned fe80:: client shows up as an empty IP
# (CLIProxyAPI, coding-agent Q809). The LAN hosts reach each other by .local for everything (Q858),
# so they resolve it over IPv4 only. Ubuntu's default is already mdns4_minimal.
- name: Resolve .local names over IPv4 only
  ansible.builtin.replace:
    path: /etc/nsswitch.conf
    regexp: '^(hosts:.*\s)mdns_minimal(\s)'
    replace: '\1mdns4_minimal\2'
  become: true
  when: ansible_facts['hostname'] in hindsight_lan_hosts

# Avahi keeps publishing this host's AAAA record. Without it a Mac waits 5 s on the AAAA lookup for
# every .local name (avahi sends no negative answer, macOS does), which broke etcd's client timeouts
# (coding-agent Q861). Only the Macs, which answer "no AAAA" at once, turn their LAN IPv6 off.

# --- ~/.hindsight/coding-agent.json: URL and token ---------------------------------
# The file holds the API token, so the read and the write are no_log and the write is 0600.
- name: Read the Hindsight client config
  ansible.builtin.slurp:
    src: "{{ hindsight_dir }}/coding-agent.json"
  register: _hindsight_cfg_raw
  failed_when: false
  check_mode: false
  no_log: true

- name: Parse the Hindsight client config
  ansible.builtin.set_fact:
    _hindsight_cfg: >-
      {{ (_hindsight_cfg_raw.content | b64decode | from_json) if _hindsight_cfg_raw.content is defined else {} }}
  no_log: true

# A host the token has not reached yet (asleep when push-token.sh ran) is skipped, not failed:
# a failure here would stop every role after this one in the nightly play.
- name: Report a missing Hindsight API token
  ansible.builtin.debug:
    msg: >-
      ~/.hindsight/coding-agent.json has no apiToken, so Hindsight is not wired here. On
      mac-mini-m2 run ~/coding-agent/devops/hindsight-server/push-token.sh <this host's ssh alias>,
      then re-run.
  when: _hindsight_cfg.apiToken | default('') | length == 0

- name: Skip the rest of the role without a token
  ansible.builtin.meta: end_role
  when: _hindsight_cfg.apiToken | default('') | length == 0

- name: Point the Hindsight client at the server
  ansible.builtin.copy:
    dest: "{{ hindsight_dir }}/coding-agent.json"
    content: "{{ _hindsight_cfg | combine(_hindsight_managed) | to_nice_json(indent=2) }}\n"
    mode: "0600"
  vars:
    # reflectTimeoutMs: the default 20 s cut off slow reflects (Haiku answer time, coding-agent Q760);
    # it stays under the harnesses' 30 s UserPromptSubmit hook timeout so the page fallback still runs.
    # pageTriggerCron: knowledge pages refresh once a night, each at its own time from 1 to 5 AM, not
    # hourly (coding-agent Q1017). Every host needs the same value: a client patches any page whose
    # trigger differs from its own config, so mixed values flap.
    # mapPathToBank: the Codex app makes a folder per chat under ~/Documents/Codex, and each one became
    # its own bank ("use", "new-chat", "how-x20"); now they share one. A mapped path wins over git, so
    # never map a folder that holds repos (~, ~/github.com).
    # bankIdTemplate: {channel} is HINDSIGHT_CHANNEL_ID, set by the .envrc files below: github under
    # ~/github.com, coding-agent under ~/github.com/soulmachine and ~/coding-agent, personal-agent
    # under ~/personal-agent; unset means coding-agent (the patch below) (coding-agent Q1026).
    # autoUpdate: off, so only this role upgrades the runtime and the patch below follows every upgrade.
    _hindsight_managed:
      apiUrl: "{{ _hindsight_url }}"
      serverMode: self-hosted
      reflectTimeoutMs: 25000
      pageTriggerCron: "H H(1-5) * * *"
      mapPathToBank: {"~/Documents/Codex": "coding-agent::codex-chats"}
      bankIdTemplate: "{channel}::{gitProject}"
      autoUpdate: false
  when: _hindsight_cfg | combine(_hindsight_managed) != _hindsight_cfg
  no_log: true

# --- the agents the installer wires ------------------------------------------------
# `install` exits 0 and prints the same summary whether or not it changed anything, so it runs
# only when the installed runtime is behind npm, or an installed agent's config lacks it (the pi
# and opencode roles rewrite their files). The runtime's own package.json follows npm, as the
# `latest` it is compared with does. Between plays it updates itself daily (autoUpdate).
- name: Get the latest published Hindsight coding-agents version
  ansible.builtin.command: npm view {{ hindsight_package }} version
  register: _hindsight_latest
  changed_when: false
  check_mode: false

- name: Read the installed Hindsight coding-agents runtime
  ansible.builtin.slurp:
    src: "{{ hindsight_dir }}/coding-agents/package.json"
  register: _hindsight_pkg_raw
  failed_when: false
  check_mode: false

# rc 0 = the agent's config is missing (not installed here) or already holds the runtime path.
- name: Check which installed agents are not wired to Hindsight
  ansible.builtin.shell: >-
    [ ! -e '{{ hindsight_home }}/{{ item }}' ] ||
    grep -qF .hindsight/coding-agents '{{ hindsight_home }}/{{ item }}'
  loop: "{{ hindsight_installer_markers }}"
  register: _hindsight_wired
  changed_when: false
  failed_when: false
  check_mode: false

# stdin is closed, so the installer's one optional prompt (Trae's workspace MCP) answers no.
- name: Install the Hindsight runtime and wire every detected agent
  ansible.builtin.shell: >-
    npx -y {{ hindsight_package }}@{{ _hindsight_latest.stdout }} install all
    --server self-hosted --api-url {{ _hindsight_url }} </dev/null
  when: >-
    _hindsight_installed != _hindsight_latest.stdout
    or _hindsight_wired.results | rejectattr('rc', 'eq', 0) | list | length > 0
  vars:
    _hindsight_installed: >-
      {{ (_hindsight_pkg_raw.content | b64decode | from_json).version
         if _hindsight_pkg_raw.content is defined else 'absent' }}
  changed_when: true

# --- the bank channel (coding-agent Q1026) ------------------------------------------
# shortcut: patches the vendored bundle so an unset channel means coding-agent, not "default"; drop it
# when upstream offers a default channel. It fails when neither form is left, so a rewrite is noticed.
- name: Make an unset Hindsight channel mean coding-agent
  ansible.builtin.shell: |
    cd '{{ hindsight_dir }}/coding-agents/dist' || exit 1
    grep -qF 'HINDSIGHT_CHANNEL_ID || "' ./*.js || { echo 'channel fallback not found' >&2; exit 1; }
    files=$(grep -lF 'HINDSIGHT_CHANNEL_ID || "default"' ./*.js) || exit 0
    sed -i.q1026 's/HINDSIGHT_CHANNEL_ID || "default"/HINDSIGHT_CHANNEL_ID || "coding-agent"/' $files
    rm -f ./*.q1026
    echo patched
  register: _hindsight_channel_patch
  changed_when: "'patched' in _hindsight_channel_patch.stdout"

# direnv loads only the nearest .envrc, so a repo with its own gets source_up_if_exists to reach the
# channel above it. soulmachine repos carry that line in git instead, so this never dirties them.
- name: Find the folders that get a channel .envrc
  ansible.builtin.stat:
    path: "{{ hindsight_home }}/{{ item.dir }}"
    follow: true
  loop: "{{ hindsight_channel_dirs }}"
  register: _hindsight_channel_dir

- name: Write the channel .envrc files
  ansible.builtin.copy:
    dest: "{{ item.stat.path }}/.envrc"
    content: "export HINDSIGHT_CHANNEL_ID={{ item.item.channel }}\n"
    mode: "0644"
  loop: "{{ _hindsight_channel_dir.results | selectattr('stat.isdir', 'defined') | selectattr('stat.isdir') }}"
  loop_control:
    label: "{{ item.item.dir }}"

- name: Find the repo .envrc files under ~/github.com
  ansible.builtin.find:
    paths: "{{ hindsight_home }}/github.com"
    patterns: .envrc
    hidden: true
    recurse: true
    depth: 3
  register: _hindsight_repo_envrc

- name: Let a repo .envrc reach the channel above it
  ansible.builtin.lineinfile:
    path: "{{ item }}"
    line: source_up_if_exists
    insertbefore: BOF
  loop: >-
    {{ _hindsight_repo_envrc.files | map(attribute='path')
       | map('regex_search', '^' ~ hindsight_home ~ '/github[.]com/(?!soulmachine/)[^/]+/[^/]+/[.]envrc$')
       | select | list }}

# direnv refuses a new or edited .envrc until it is allowed; `direnv exec` says "is blocked" then.
- name: Allow the channel .envrc files in direnv
  ansible.builtin.command:
    argv: "{{ ['bash', '-c', _script, 'bash'] + _paths }}"
  register: _hindsight_direnv_allow
  changed_when: "'allowed' in _hindsight_direnv_allow.stdout"
  vars:
    _script: >-
      for f in "$@"; do [ -f "$f" ] || continue;
      if direnv exec "$(dirname "$f")" true 2>&1 | grep -q 'is blocked'; then direnv allow "$f" && echo "allowed $f"; fi;
      done
    _paths: >-
      {{ hindsight_channel_dirs | map(attribute='dir') | map('regex_replace', '^', hindsight_home ~ '/')
         | map('regex_replace', '$', '/.envrc') | list
         + (_hindsight_repo_envrc.files | map(attribute='path') | list) }}

# --- the agents it does not cover: the runtime's stdio MCP server ---------------------
# rc 0 = the agent is installed and its config does not name the MCP server yet.
- name: Check which other agents still need the Hindsight MCP server
  ansible.builtin.shell: >-
    command -v {{ item.exe }} >/dev/null &&
    ! grep -qF '{{ hindsight_mcp_server }}' '{{ hindsight_home }}/{{ item.config }}' 2>/dev/null
  loop: "{{ hindsight_cli_agents }}"
  loop_control:
    label: "{{ item.exe }}"
  register: _hindsight_cli_probe
  changed_when: false
  failed_when: false
  check_mode: false

- name: Register the Hindsight MCP server in the other CLI agents
  ansible.builtin.shell:
    cmd: "{{ item.item.remove }} </dev/null >/dev/null 2>&1; {{ item.item.add }}"
    stdin: "{{ item.item.stdin | default(omit) }}"
  loop: "{{ _hindsight_cli_probe.results }}"
  loop_control:
    label: "{{ item.item.exe }}"
  when: item.rc == 0
  changed_when: true

# The files can carry API keys in other servers' env blocks, so no_log and 0600.
- name: Read the JSON-configured agents' MCP files
  ansible.builtin.slurp:
    src: "{{ hindsight_home }}/{{ item.dir }}/{{ item.file }}"
  loop: "{{ hindsight_json_agents }}"
  loop_control:
    label: "{{ item.dir }}/{{ item.file }}"
  register: _hindsight_json_raw
  failed_when: false
  check_mode: false
  no_log: true

- name: Find which JSON-configured agents are installed
  ansible.builtin.stat:
    path: "{{ hindsight_home }}/{{ item.dir }}"
  loop: "{{ hindsight_json_agents }}"
  loop_control:
    label: "{{ item.dir }}"
  register: _hindsight_json_dirs

# `e30=` is base64 `{}`, for an agent that is installed but has no MCP file yet.
- name: Register the Hindsight MCP server in the JSON-configured agents
  ansible.builtin.copy:
    dest: "{{ hindsight_home }}/{{ item.0.item.dir }}/{{ item.0.item.file }}"
    content: "{{ _config | combine({item.0.item.key: {'hindsight': item.0.item.entry}}, recursive=true) | to_nice_json(indent=2) }}\n"
    mode: "0600"
  vars:
    _config: "{{ (item.0.content | default('e30=') | b64decode | trim or '{}') | from_json }}"
  loop: "{{ _hindsight_json_raw.results | zip(_hindsight_json_dirs.results) | list }}"
  loop_control:
    label: "{{ item.0.item.dir }}/{{ item.0.item.file }}"
  when:
    - item.1.stat.exists
    - (_config[item.0.item.key] | default({}))['hindsight'] | default(none) != item.0.item.entry
  no_log: true

# --- remote hosts: the failover relays, one per m2 service (hindsight_relays) ----------
- name: Ensure ~/.local/bin exists
  ansible.builtin.file:
    path: "{{ hindsight_home }}/.local/bin"
    state: directory
    mode: "0755"
  when: _hindsight_url == hindsight_relay_url

- name: Install hindsight-relay
  ansible.builtin.copy:
    src: hindsight-relay
    dest: "{{ hindsight_home }}/.local/bin/hindsight-relay"
    mode: "0755"
  register: _hindsight_relay_bin
  when: _hindsight_url == hindsight_relay_url

- name: Install the relays
  ansible.builtin.include_tasks: relay.yml
  loop: "{{ hindsight_relays }}"
  loop_control:
    loop_var: relay
    label: "{{ relay.name }}"
  when:
    - _hindsight_url == hindsight_relay_url
    - ansible_facts['hostname'] != 'mac-mini-m2'
    - relay.name not in hindsight_relays_skip.get(ansible_facts['hostname'], [])
