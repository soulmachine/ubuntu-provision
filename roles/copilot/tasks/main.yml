---
# GitHub Copilot CLI from npm, unless another channel already provides it. It reaches models only
# through CLIProxyAPI: `copilot-gw`, written by `cliproxy-tier <host>` on mac-mini-m2, sets its
# BYOK variables for that one process (coding-agent Q401).
- name: Install GitHub Copilot CLI from npm
  ansible.builtin.include_role:
    name: nodejs
    tasks_from: npm_global
  vars:
    nodejs_npm_package: "@github/copilot"
    nodejs_npm_cmd: copilot
