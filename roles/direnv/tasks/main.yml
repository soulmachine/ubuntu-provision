---
- name: Install direnv
  become: true
  ansible.builtin.apt:
    name: direnv
    state: present

# Interactive shells only, by design: see the dotenv role for what non-interactive ones get.
- name: Hook direnv into .bashrc
  ansible.builtin.lineinfile:
    path: "{{ lookup('env', 'HOME') }}/.bashrc"
    line: 'eval "$(direnv hook bash)"'
    regexp: 'direnv hook bash'
