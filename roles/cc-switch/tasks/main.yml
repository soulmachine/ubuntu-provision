---
# cc-switch is a GUI desktop app (a Tauri app that switches Claude/Codex/Gemini
# configs), distributed on macOS as a Homebrew cask. It is cross-platform and
# ships Linux .deb / AppImage builds, but it is GUI — skipped on the headless
# server profile. To install it on an Ubuntu desktop, download the latest .deb
# from https://github.com/farion1231/cc-switch/releases and:
#
#   - name: Install cc-switch
#     become: true
#     ansible.builtin.apt:
#       deb: /path/to/cc-switch_<version>_amd64.deb
- name: Skip cc-switch (GUI desktop app, headless profile)
  ansible.builtin.debug:
    msg: "cc-switch is a GUI app; skipped on headless Ubuntu (see role comment for the .deb)."
