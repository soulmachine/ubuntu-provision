---
# Codex: `codex plugin marketplace add` snapshots the repo's marketplace
# (.agents/plugins/marketplace.json, name `ponytail`) as a git checkout under
# ~/.codex/.tmp/marketplaces/ponytail and records `[marketplaces.ponytail]` in
# ~/.codex/config.toml; `codex plugin add` copies the plugin into
# ~/.codex/plugins/cache and records `[plugins."ponytail@ponytail"]`. Both
# sections are written for every marketplace and plugin (27 checked on this
# host), so they are the idempotency markers — cheaper than
# `codex plugin list`, which may go to the network.
#
# no_log on both: config.toml carries API keys in `[mcp_servers.*.env]`, and an ad-hoc
# `include_role` run prints every result in full, base64 being no protection.
- name: Read the Codex config
  ansible.builtin.slurp:
    src: "{{ ponytail_home }}/.codex/config.toml"
  register: ponytail_codex_config_raw
  failed_when: false
  no_log: true

- name: Decode the Codex config
  ansible.builtin.set_fact:
    ponytail_codex_config: "{{ ponytail_codex_config_raw.content | default('') | b64decode }}"
  no_log: true

- name: Add the ponytail Codex marketplace
  ansible.builtin.command: codex plugin marketplace add {{ ponytail_repo }}
  when: >-
    '[marketplaces.' ~ ponytail_codex_marketplace ~ ']' not in ponytail_codex_config
  register: ponytail_codex_mp_add
  changed_when: true

- name: Install the ponytail Codex plugin
  ansible.builtin.command: codex plugin add {{ ponytail_codex_plugin }}
  when: >-
    '[plugins."' ~ ponytail_codex_plugin ~ '"]' not in ponytail_codex_config
  register: ponytail_codex_install
  changed_when: true

# Refresh. `codex plugin marketplace upgrade <name>` compares upstream HEAD
# with the revision it recorded at install time in the snapshot's
# .codex-marketplace-install.json, and when they differ stages a fresh checkout,
# activates it in place of the snapshot and refreshes the installed plugin
# cache under ~/.codex/plugins/cache/ponytail (the binary carries "failed to
# create marketplace upgrade staging directory", "failed to activate upgraded
# marketplace" and "failed to refresh installed plugin cache after marketplace
# upgrade" for those steps); otherwise it prints "is already up to date." That
# recorded `revision` is the state codex tracks, so it is what gets diffed —
# not the checkout's HEAD: with the snapshot rewound one commit the upgrade
# still answered "already up to date" and left the working tree alone, because
# the record still matched upstream.
#
# Gated on the marketplace being registered, not on the record existing: on codex
# 0.161.0 `marketplace add` writes no record — the first `upgrade` does (measured
# 2026-10-07, Q193) — so a record gate never opened on a fresh host and the plugin
# froze at its install commit. A missing record reads as an empty revision, so that
# first upgrade reports `updated` once. Skipped under `--check` on a fresh host, where
# the add above did not run.
- name: Refresh the ponytail Codex plugin
  when: >-
    ponytail_codex_mp_add is changed
    or '[marketplaces.' ~ ponytail_codex_marketplace ~ ']' in ponytail_codex_config
  block:
    - name: Read the ponytail Codex marketplace record before upgrading
      ansible.builtin.slurp:
        src: "{{ ponytail_codex_record }}"
      register: ponytail_codex_record_before
      failed_when: false

    - name: Upgrade the ponytail Codex marketplace
      ansible.builtin.command: codex plugin marketplace upgrade {{ ponytail_codex_marketplace }}
      changed_when: false

    - name: Read the ponytail Codex marketplace record after upgrading
      ansible.builtin.slurp:
        src: "{{ ponytail_codex_record }}"
      register: ponytail_codex_record_after

    - name: Check whether the ponytail Codex plugin was updated
      ansible.builtin.debug:
        msg: >-
          ponytail Codex plugin
          {{ 'updated' if ponytail_codex_updated else 'already up to date' }}
      vars:
        ponytail_codex_rev_before: >-
          {{ (ponytail_codex_record_before.content | default('e30=') | b64decode | from_json).revision
             | default('') }}
        ponytail_codex_rev_after: "{{ (ponytail_codex_record_after.content | b64decode | from_json).revision }}"
        ponytail_codex_updated: "{{ ponytail_codex_rev_before != ponytail_codex_rev_after }}"
      changed_when: ponytail_codex_updated

# The plugin ships three lifecycle hooks (hooks/claude-codex-hooks.json:
# SessionStart, UserPromptSubmit, SubagentStart). Codex runs plugin hooks only
# after each one is reviewed and trusted, and only with `[features] hooks =
# true`, which this role does not manage. Trust is per hook content: a
# `trusted_hash` under `[hooks.state."<plugin>@<marketplace>:<hooks file>:
# <event>:<group>:<handler>"]` in ~/.codex/config.toml, which the `/hooks`
# screen writes through the app-server's `config/batchWrite`. `hooks/list`
# over a stdio `codex app-server` reports each hook's `currentHash` and
# `trustStatus`, so the review can be done headlessly (verified 2026-09-08);
# the hash covers the unsubstituted command, so it is the same on every host
# running the same ponytail version. The role still does not write it: an
# unpinned write would trust whatever upstream ships next, which is what the
# review exists to catch, and pinned hashes go stale on every ponytail
# release. `bypass_hook_trust` is a policy-level blanket bypass, not a trust.
# Without the trust the skills still work; only the always-on activation
# stays quiet.
# noqa no-handler: a handler would print this at the end of a forty-role play,
# far from the install it explains; a debug beside the task keeps them together.
- name: Remind about the one-time Codex hook trust # noqa: no-handler
  ansible.builtin.debug:
    msg: >-
      ponytail was just installed into Codex. Run `codex`, open `/hooks`,
      review and trust ponytail's three lifecycle hooks (SessionStart,
      UserPromptSubmit, SubagentStart), then start a new thread.
  when: ponytail_codex_install is changed
