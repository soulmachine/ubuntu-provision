---
# OpenCode loads npm plugins listed in the `plugin` array of
# ~/.config/opencode/opencode.json, bun-installing them at startup into
# ~/.cache/opencode/packages/<spec>. A bare package name resolves as `@latest`
# (parsePluginSpecifier in opencode's src/plugin/shared.ts), so there is
# nothing to refresh from here — OpenCode re-resolves it itself. The
# oh-my-openagent installer (opencode role) rewrites this file on every run but
# keeps entries it does not own (it preserved claude-mem's), so one append
# survives.
#
# Read → append → write, gated on the entry being absent, so the file is not
# rewritten on converged runs. `to_nice_json(indent=2)` matches the 2-space
# layout oh-my-openagent writes; keys sort, but `$schema` sorts first anyway.
#
# The file carries API keys — jev-register-agents bakes them into its MCP env blocks and
# chmods it 0600 — so the read, parse and write are no_log, and the write keeps 0600
# rather than loosening it to 0644.
- name: Ensure the OpenCode config directory exists
  ansible.builtin.file:
    path: "{{ ponytail_home }}/.config/opencode"
    state: directory
    mode: "0755"

- name: Read the OpenCode config
  ansible.builtin.slurp:
    src: "{{ ponytail_home }}/.config/opencode/opencode.json"
  register: ponytail_opencode_raw
  failed_when: false
  no_log: true

- name: Parse the OpenCode config
  ansible.builtin.set_fact:
    ponytail_opencode_settings: >-
      {{ (ponytail_opencode_raw.content | b64decode | from_json)
         if (ponytail_opencode_raw.content | default('') | b64decode | trim | length > 0)
         else {} }}
  no_log: true

- name: Register the ponytail OpenCode plugin
  ansible.builtin.copy:
    dest: "{{ ponytail_home }}/.config/opencode/opencode.json"
    content: "{{ ponytail_opencode_merged | to_nice_json(indent=2) }}\n"
    mode: "0600"
  no_log: true
  vars:
    ponytail_opencode_merged: >-
      {{ ponytail_opencode_settings
         | combine({'plugin': (ponytail_opencode_settings.plugin | default([])) + [ponytail_npm_package]}) }}
  when: ponytail_npm_package not in (ponytail_opencode_settings.plugin | default([]))
