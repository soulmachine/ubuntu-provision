---
# Optional role (not in main.yml). On Ubuntu the Berkeley DB headers come from the
# apt package libdb-dev (installed to standard prefixes), so bsddb3 finds them
# without the BERKELEYDB_DIR hint the macOS/Homebrew build needed.
- name: Install Scrapy
  ansible.builtin.pip:
    name: scrapy
    executable: pip3

- name: Install Berkeley DB headers for deltafetch
  become: true
  ansible.builtin.apt:
    name: libdb-dev
    state: present

- name: Install bsddb3
  ansible.builtin.pip:
    name: bsddb3
    executable: pip3
  environment:
    YES_I_HAVE_THE_RIGHT_TO_USE_THIS_BERKELEY_DB_VERSION: "yes"

- name: Install scrapy-deltafetch
  ansible.builtin.pip:
    name: scrapy-deltafetch
    executable: pip3
