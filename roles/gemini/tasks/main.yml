---
# Gemini CLI from npm. Plain `gemini` stays native. `cliproxy-tier <host>` on mac-mini-m2 writes
# `gemini-gw` and its gateway home ~/.gemini-gw (macbook-provision docs/gateway-policy.md).
- name: Install Gemini CLI from npm
  ansible.builtin.include_role:
    name: nodejs
    tasks_from: npm_global
  vars:
    nodejs_npm_package: "@google/gemini-cli"
    nodejs_npm_cmd: gemini
