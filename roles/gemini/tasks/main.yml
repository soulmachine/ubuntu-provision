---
# Gemini CLI from npm. `cliproxy-tier <host>` on mac-mini-m2 sends plain `gemini` through the gateway with a
# `~/.local/bin/gemini` shim, and writes `gemini-origin` with its Google-login home ~/.gemini-origin
# (~/coding-agent/devops/cliproxyapi/gateway-policy.md).
- name: Install Gemini CLI from npm
  ansible.builtin.include_role:
    name: nodejs
    tasks_from: npm_global
  vars:
    nodejs_npm_package: "@google/gemini-cli"
    nodejs_npm_cmd: gemini
