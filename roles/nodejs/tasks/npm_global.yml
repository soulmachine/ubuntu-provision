---
# Install or update one CLI as an npm global, unless another channel already provides its
# command (a mise tool, a native installer in ~/.local/bin, Homebrew): two copies on PATH, each
# with its own updater, is how a host ends up running the stale one. A role includes this with
#
#   - ansible.builtin.include_role:
#       name: nodejs
#       tasks_from: npm_global
#     vars:
#       nodejs_npm_package: "@github/copilot"
#       nodejs_npm_cmd: copilot
- name: Check whether npm owns {{ nodejs_npm_package }}
  ansible.builtin.command: npm ls -g --depth=0 {{ nodejs_npm_package }}
  register: nodejs_npm_owned
  changed_when: false
  failed_when: false
  check_mode: false

- name: Look for another channel's copy of {{ nodejs_npm_cmd }}
  ansible.builtin.command: which {{ nodejs_npm_cmd }}
  register: nodejs_npm_other
  changed_when: false
  failed_when: false
  check_mode: false
  when: nodejs_npm_owned.rc != 0

# A hit under mise's shims is not another channel: mise here manages only node, go and java, so
# a shim for any other command is an npm global's, and `npm ls` just said npm does not own it under
# the current Node. That is a shim left from an older Node after `mise use --global node@lts` moved
# on (dev-server-frank, 2026-10-12: openclaw and gemini sat under node 24.17.0, the shim answered
# `which`, and this skipped the install while `openclaw` itself failed with "No version is set").
- name: Decide whether another channel really owns {{ nodejs_npm_cmd }}
  ansible.builtin.set_fact:
    nodejs_npm_foreign: "{{ nodejs_npm_owned.rc != 0 and nodejs_npm_other.rc == 0 and '/mise/shims/' not in nodejs_npm_other.stdout }}"

- name: Install from npm {{ nodejs_npm_package }}
  community.general.npm:
    name: "{{ nodejs_npm_package }}"
    global: true
    state: latest
  when: not nodejs_npm_foreign

- name: Report another channel's copy of {{ nodejs_npm_cmd }}
  ansible.builtin.debug:
    msg: >-
      {{ nodejs_npm_cmd }} is already installed at {{ nodejs_npm_other.stdout }} by another channel, so npm
      leaves it alone; that channel keeps it current.
  when: nodejs_npm_foreign
