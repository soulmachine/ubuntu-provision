---
# zsh is not installed by default on Ubuntu Server, so install it first (macOS
# ships zsh). The default-shell change uses the `user` module + getent instead of
# macOS `dscl`.
- name: Install zsh
  become: true
  ansible.builtin.apt:
    name: zsh
    state: present

- name: Install oh-my-zsh
  ansible.builtin.shell: sh -c "$(curl -fsSL https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh)" "" --unattended
  args:
    creates: "{{ lookup('env', 'HOME') }}/.oh-my-zsh"

- name: Resolve zsh path
  ansible.builtin.shell: command -v zsh # noqa: command-instead-of-shell
  register: oh_my_zsh_zsh_path
  changed_when: false

- name: Check current login shell
  ansible.builtin.shell:
    cmd: 'set -o pipefail && getent passwd "$(id -un)" | cut -d: -f7'
    executable: /bin/bash # set -o pipefail; /bin/sh is dash on Ubuntu (no pipefail pre-24.04)
  register: oh_my_zsh_current_shell
  changed_when: false

- name: Set zsh as default shell
  become: true
  ansible.builtin.user:
    name: "{{ lookup('env', 'USER') }}"
    shell: "{{ oh_my_zsh_zsh_path.stdout }}"
  when: oh_my_zsh_current_shell.stdout != oh_my_zsh_zsh_path.stdout

- name: Install zsh-autosuggestions # noqa: latest[git]
  ansible.builtin.git:
    repo: https://github.com/zsh-users/zsh-autosuggestions
    dest: "{{ lookup('env', 'HOME') }}/.oh-my-zsh/custom/plugins/zsh-autosuggestions"
    version: HEAD
    update: false

- name: Enable oh-my-zsh plugins in .zshrc
  ansible.builtin.lineinfile:
    path: "{{ lookup('env', 'HOME') }}/.zshrc"
    regexp: '^(plugins=\((?!.*\b{{ item }}\b).*)\)$'
    line: '\1 {{ item }})'
    backrefs: true
  loop:
    - zsh-autosuggestions

- name: Ensure ~/.local/bin is prepended to PATH in .zshrc
  ansible.builtin.lineinfile:
    path: "{{ lookup('env', 'HOME') }}/.zshrc"
    regexp: '^export PATH=".*\$HOME/\.local/bin.*"$'
    line: 'export PATH="$HOME/.local/bin:$PATH"'
    state: present

# bootstrap.sh activated mise in ~/.bashrc (the install-time shell). After the
# default shell is switched to zsh, new logins read ~/.zshrc, so activate mise
# there too (this line has no macOS equivalent — macOS bootstrap wrote it to
# ~/.zshrc directly, but on Ubuntu oh-my-zsh's installer owns ~/.zshrc).
- name: Ensure mise is activated in .zshrc
  ansible.builtin.lineinfile:
    path: "{{ lookup('env', 'HOME') }}/.zshrc"
    regexp: '^eval "\$\(mise activate zsh\)"$'
    line: 'eval "$(mise activate zsh)"'
    state: present
