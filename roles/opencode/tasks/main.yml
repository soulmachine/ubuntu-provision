---
- name: Install opencode CLI
  community.general.npm:
    name: opencode-ai
    global: true
    state: latest

# oh-my-openagent ships no Ansible module — it's installed/configured by running
# its `npx oh-my-openagent install` CLI, which must run AFTER opencode is present
# (it verifies the OpenCode install and writes into ~/.config/opencode). Notes:
#
# 1. Required flags. In `--no-tui` mode the CLI requires --claude, --gemini and
#    --copilot explicitly (they have no defaults); omit any and it aborts with
#    "Validation failed". --platform and --skip-auth keep the run headless (no
#    interactive provider auth).
#
# 2. It writes `opencode.json`, NOT `oh-my-openagent.json`. This is the bug this
#    role carried until 2026-09-15: it checksummed
#    ~/.config/opencode/oh-my-openagent.json, which upstream stopped writing
#    around 2026-06-25 (the newest backup of that name on this fleet is
#    2026-06-25; `opencode.json.backup-*` continue to the present day). With the
#    watched file absent, the before/after checksums compared '' to '' forever,
#    so the report task said "already up to date" on every run whatever happened.
#    The config now lives in `opencode.json` under `plugin` as
#    "oh-my-openagent@latest", alongside this repo's own gateway provider block
#    and MCP servers — which upstream preserves across runs.
#
# 3. It is gated, because `npx --yes` re-fetches the package over the network and
#    each run rewrites opencode.json and leaves a NEW `opencode.json.backup-<ts>`
#    behind. Ungated that is one network fetch and one junk file per play: 81 of
#    them (384 KB) had accumulated here by 2026-09-15, every recent one
#    byte-identical to the live file. The gate is a version stamp diffed against
#    npm's `latest`, the same shape the claude-mem role uses — state, not stdout,
#    per AGENTS.md "Self-update tasks". It still refreshes when upstream ships new
#    model mappings, and still repairs a host whose config lost the plugin entry.
#
# `npx --yes` skips npx's "Ok to proceed?" prompt so the task cannot hang.

- name: Set oh-my-openagent paths
  ansible.builtin.set_fact:
    opencode_config_path: "{{ lookup('env', 'HOME') }}/.config/opencode/opencode.json"
    opencode_omo_stamp_path: "{{ lookup('env', 'HOME') }}/.config/opencode/.oh-my-openagent-version"

- name: Capture opencode config checksum before install
  ansible.builtin.stat:
    path: "{{ opencode_config_path }}"
  register: opencode_config_before

- name: Read the opencode config
  ansible.builtin.slurp:
    src: "{{ opencode_config_path }}"
  register: opencode_config_raw
  when: opencode_config_before.stat.exists
  check_mode: false
  # The file carries API keys in its MCP env blocks (jev-register-agents writes them),
  # and an ad-hoc `include_role` run prints every result in full.
  no_log: true

# `failed_when: false` rather than a `stat` gate: the stamp is absent on every
# host that provisioned before this role learned to write one, which is normal.
- name: Read the recorded oh-my-openagent version
  ansible.builtin.slurp:
    src: "{{ opencode_omo_stamp_path }}"
  register: opencode_omo_stamp
  failed_when: false
  check_mode: false

# A spent registry or an offline host must not trigger the installer, so this
# reports its failure into an empty string and the gate below treats that as
# "no version information" — which cannot satisfy the version half of the test.
- name: Look up the latest oh-my-openagent version
  ansible.builtin.command: npm view oh-my-openagent version
  register: opencode_omo_latest
  changed_when: false
  failed_when: false
  check_mode: false

# Split across two set_fact tasks because a set_fact CANNOT reference a key
# defined in the same task.
- name: Read the oh-my-openagent state
  ansible.builtin.set_fact:
    opencode_omo_latest_version: "{{ opencode_omo_latest.stdout | default('', true) | trim }}"
    opencode_omo_stamped_version: "{{ opencode_omo_stamp.content | default('', true) | b64decode | trim }}"
    opencode_omo_configured: >-
      {{ opencode_config_before.stat.exists
         and 'oh-my-openagent' in (opencode_config_raw.content | default('', true) | b64decode) }}

- name: Decide whether oh-my-openagent needs to run
  ansible.builtin.set_fact:
    opencode_omo_needed: >-
      {{ (not (opencode_omo_configured | bool))
         or (opencode_omo_latest_version | length > 0
             and opencode_omo_latest_version != opencode_omo_stamped_version) }}

- name: Install and configure oh-my-openagent for OpenCode (non-interactive)
  ansible.builtin.command: >-
    npx --yes oh-my-openagent install
    --no-tui
    --platform=opencode
    --skip-auth
    --claude=max20
    --openai=no
    --gemini=no
    --copilot=no
  register: opencode_omo_install
  when: opencode_omo_needed | bool
  changed_when: false # real change is reported by the checksum-diff task below

- name: Capture opencode config checksum after install
  ansible.builtin.stat:
    path: "{{ opencode_config_path }}"
  register: opencode_config_after

# Written only after the installer actually succeeded, so a failed run retries
# next play instead of being recorded as done.
- name: Record the oh-my-openagent version that was installed
  ansible.builtin.copy:
    content: "{{ opencode_omo_latest_version }}\n"
    dest: "{{ opencode_omo_stamp_path }}"
    mode: "0644"
  when:
    - opencode_omo_needed | bool
    - opencode_omo_latest_version | length > 0
    - not (opencode_omo_install is failed)

- name: Report oh-my-openagent configuration change
  ansible.builtin.debug:
    msg: >-
      oh-my-openagent {{ opencode_omo_latest_version | default('(version unknown)', true) }}
      {{ 'installed/updated — opencode.json changed' if opencode_omo_config_changed
         else ('ran, opencode.json unchanged' if (opencode_omo_needed | bool)
               else 'already up to date — skipped') }}
  vars:
    opencode_omo_config_changed: "{{ (opencode_config_before.stat.checksum | default('')) != (opencode_config_after.stat.checksum | default('')) }}"
  changed_when: opencode_omo_config_changed
