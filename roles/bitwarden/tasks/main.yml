---
# Bitwarden clients for Frank's Vaultwarden (~/coding-agent/docs/vaultwarden.md): `rbw` from apt,
# the official `bw` CLI from npm, and the official Electron desktop app on hosts with a desktop
# session only. `bw` and `rbw` are then pointed at the server (upstream Q244, DECISIONS Q41); the
# desktop app's server and every login stay manual.

# Ubuntu's rbw depends on pinentry-curses, so `rbw unlock` works over ssh.
- name: Install rbw
  become: true
  ansible.builtin.apt:
    name: rbw
    state: present
  when: ansible_distribution != 'Debian'

# Debian 13 ships no rbw package (grokbot-box), so build it with cargo and link it onto the
# system PATH for the config tasks; pinentry-curses keeps `rbw unlock` working over ssh.
- name: Install rbw on Debian
  when: ansible_distribution == 'Debian'
  block:
    - name: Install pinentry-curses
      become: true
      ansible.builtin.apt:
        name: pinentry-curses
        state: present

    - name: Build rbw with cargo
      ansible.builtin.command: "{{ ansible_env.HOME }}/.cargo/bin/cargo install --locked rbw"
      args:
        creates: "{{ ansible_env.HOME }}/.cargo/bin/rbw"

    - name: Link rbw onto the system PATH
      become: true
      ansible.builtin.file:
        src: "{{ ansible_env.HOME }}/.cargo/bin/rbw"
        dest: /usr/local/bin/rbw
        state: link

- name: Install the Bitwarden CLI from npm
  ansible.builtin.include_role:
    name: nodejs
    tasks_from: npm_global
  vars:
    nodejs_npm_package: "@bitwarden/cli"
    nodejs_npm_cmd: bw

# Headless means no X11 or Wayland session file (DECISIONS Q36): dev-server-frank has none,
# supermicro's GNOME Flashback has one.
- name: Look for a desktop session
  ansible.builtin.find:
    paths:
      - /usr/share/xsessions
      - /usr/share/wayland-sessions
    patterns: "*.desktop"
  register: bitwarden_sessions

- name: Report that the Bitwarden desktop app was skipped
  ansible.builtin.debug:
    msg: Skipping the Bitwarden desktop app, because this host has no X11 or Wayland session.
  when: bitwarden_sessions.matched == 0

# Bitwarden ships no apt repo. Its download link redirects to the newest .deb on the GitHub
# release, so the redirect names the version without a GitHub API call, as roles/email does.
# shortcut: the .deb is amd64 only and so are both hosts; add a `uname -m` guard for an arm64 host.
- name: Install or update the Bitwarden desktop app
  when: bitwarden_sessions.matched > 0
  block:
    - name: Read the installed Bitwarden version
      ansible.builtin.command: dpkg-query -W -f='${Version}' bitwarden
      register: bitwarden_installed
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Resolve the latest Bitwarden desktop .deb
      ansible.builtin.uri:
        url: https://vault.bitwarden.com/download/?app=desktop&platform=linux&variant=deb
        follow_redirects: none
        status_code: [301, 302]
      register: bitwarden_release
      check_mode: false

    # A set_fact template, not the `when:` below: a bare expression reads '\1' as an escape.
    - name: Work out the Bitwarden desktop version
      ansible.builtin.set_fact:
        bitwarden_latest: "{{ bitwarden_release.location | regex_search('/Bitwarden-([0-9][^/]*)-amd64\\.deb$', '\\1') | first }}"

    - name: Install the Bitwarden desktop .deb
      become: true
      ansible.builtin.apt:
        deb: "{{ bitwarden_release.location }}"
      when: (bitwarden_installed.stdout | default('')) != bitwarden_latest

- name: Point bw and rbw at Vaultwarden
  ansible.builtin.include_tasks: config.yml
