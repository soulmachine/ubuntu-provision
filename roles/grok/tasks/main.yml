---
# Grok CLI (xAI) from npm. The package is a launcher: the first `grok` call downloads the native
# binary into ~/.grok/bin. Plain `grok` stays native. `grok-gw` and its gateway home ~/.grok-gw
# come from `cliproxy-tier <host>` on mac-mini-m2 (macbook-provision docs/gateway-policy.md).
- name: Install Grok CLI from npm
  ansible.builtin.include_role:
    name: nodejs
    tasks_from: npm_global
  vars:
    nodejs_npm_package: "@xai-official/grok"
    nodejs_npm_cmd: grok
