---
# DeepSeek Harness (`dsh`) and the plugins in vars/main.yml. `dsh plugin --profile <p> …` runs
# pnpm in ~/.dsh/profiles/<p>/ and finds `pnpm` through PATH, so pnpm is installed first.
- name: Install pnpm from npm
  ansible.builtin.include_role:
    name: nodejs
    tasks_from: npm_global
  vars:
    nodejs_npm_package: pnpm
    nodejs_npm_cmd: pnpm

- name: Install DeepSeek Harness from npm
  ansible.builtin.include_role:
    name: nodejs
    tasks_from: npm_global
  vars:
    nodejs_npm_package: "@deepseek-ai/dsh"
    nodejs_npm_cmd: dsh

# A profile that does not exist yet has no package.json; `dsh plugin` creates it on first use.
- name: Read the dsh profile manifests
  ansible.builtin.slurp:
    src: "{{ lookup('env', 'HOME') }}/.dsh/profiles/{{ item }}/package.json"
  loop: "{{ dsh_plugins | map(attribute='profile') | unique }}"
  register: dsh_manifests
  failed_when: false
  check_mode: false

- name: Collect the plugins each dsh profile already has
  ansible.builtin.set_fact:
    dsh_installed: "{{ dsh_installed | default({}) | combine({item.item: (item.content | b64decode | from_json).dependencies | default({})}) }}"
  loop: "{{ dsh_manifests.results | selectattr('content', 'defined') }}"
  loop_control:
    label: "{{ item.item }}"

# The lockfile records every resolved version and git commit, so its checksum is the diff.
- name: Record the dsh plugin lockfiles
  ansible.builtin.stat:
    path: "{{ lookup('env', 'HOME') }}/.dsh/profiles/{{ item }}/pnpm-lock.yaml"
  loop: "{{ dsh_plugins | map(attribute='profile') | unique }}"
  register: dsh_lock_before

# `add <spec>@latest` installs a missing plugin and upgrades an installed one, and it is the only
# path dsh checks against the running dsh: its plugin manager vets `add`/`install` and not `update`
# (INSTALL_COMMANDS in dsh-plugin-manager), so a too-new release is refused and the old one stays.
# A plain re-`add <spec>` keeps the saved version, hence @latest; --save-exact still writes it
# exact. A git spec has no tag, re-`add` keeps its locked commit, and only `update <name>` moves it
# to the branch head (tested 2026-10-23). dsh vets a git plugin on neither path (macbook-provision Q282).
# failed_when: false: a rejected plugin (dsh-find-plugin 0.4.0 on dsh 0.2.1-rc.2, 2026-10-21) or
# a registry hiccup should not stop the roles after this one; the warning below names the command.
- name: Install or upgrade the dsh plugins
  ansible.builtin.command: >-
    dsh plugin --profile {{ item.profile }}
    {{ 'update ' ~ item.name if dsh_git and dsh_has
       else 'add ' ~ item.args | default('') ~ ' ' ~ item.spec ~ ('' if dsh_git else '@latest') }}
  vars:
    dsh_git: "{{ item.spec is match('github:') }}"
    dsh_has: "{{ item.name | default(item.spec) in (dsh_installed | default({})).get(item.profile, {}) }}"
  loop: "{{ dsh_plugins }}"
  loop_control:
    label: "{{ item.profile }}: {{ item.spec }}"
  register: dsh_add
  changed_when: false
  failed_when: false

- name: Warn that dsh could not install or upgrade a plugin
  ansible.builtin.debug:
    msg:
      - "`{{ item.cmd | join(' ') }}` exited {{ item.rc }}:"
      - "{{ item.stderr | default('') | trim }}"
  loop: "{{ dsh_add.results | rejectattr('skipped', 'defined') | rejectattr('rc', 'eq', 0) }}"
  loop_control:
    label: "{{ item.item.profile }}: {{ item.item.spec }}"

- name: Check whether the dsh plugins changed
  ansible.builtin.stat:
    path: "{{ lookup('env', 'HOME') }}/.dsh/profiles/{{ item }}/pnpm-lock.yaml"
  loop: "{{ dsh_plugins | map(attribute='profile') | unique }}"
  loop_control:
    index_var: dsh_i
  register: dsh_lock_after
  # Inside a loop, the registered name holds this item's result.
  changed_when: dsh_lock_after.stat.checksum | default('') != dsh_lock_before.results[dsh_i].stat.checksum | default('')
