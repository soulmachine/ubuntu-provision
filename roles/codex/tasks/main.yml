---
# npm, not ChatGPT.app as upstream (its d05ab3f): there is no desktop app on Linux. The npm
# module with `state: latest` re-resolves on every run and reports `changed` only when it
# moved the installed version, so it is its own version diff.
- name: Install Codex CLI
  community.general.npm:
    name: "@openai/codex"
    global: true
    state: latest

- name: Add codex-yolo alias to .bashrc
  ansible.builtin.lineinfile:
    path: "{{ lookup('env', 'HOME') }}/.bashrc"
    line: 'alias codex-yolo="codex --yolo -c model_reasoning_effort=high"'
    regexp: '^alias codex-yolo='
    state: present
