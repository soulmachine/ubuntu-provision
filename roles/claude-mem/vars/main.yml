---
# Paths for the removal role (see tasks/main.yml).
claude_mem_home: "{{ lookup('env', 'HOME') }}"
claude_mem_dir: "{{ claude_mem_home }}/.claude-mem"
claude_mem_marketplace: "{{ claude_mem_home }}/.claude/plugins/marketplaces/thedotmack"

claude_mem_leftovers:
  - "{{ claude_mem_dir }}"
  - "{{ claude_mem_marketplace }}"
  - "{{ claude_mem_home }}/.claude/plugins/cache/thedotmack"
  - "{{ claude_mem_home }}/.claude/plugins/data/claude-mem-thedotmack"
  - "{{ claude_mem_home }}/.claude/plugins/data/claude-mem-inline"
  - "{{ claude_mem_home }}/.codex/plugins/cache/claude-mem-local"
  - "{{ claude_mem_home }}/.config/opencode/plugins/claude-mem.js"
  - "{{ claude_mem_home }}/.openclaw/extensions/claude-mem"

# Files that must not mention claude-mem once the role has run.
claude_mem_config_files:
  - "{{ claude_mem_home }}/.claude/settings.json"
  - "{{ claude_mem_home }}/.claude/plugins/installed_plugins.json"
  - "{{ claude_mem_home }}/.claude/plugins/known_marketplaces.json"
  - "{{ claude_mem_home }}/.codex/config.toml"
  - "{{ claude_mem_home }}/.codex/cliproxy.config.toml"
  - "{{ claude_mem_home }}/.gemini/settings.json"
  - "{{ claude_mem_home }}/.config/opencode/opencode.json"
