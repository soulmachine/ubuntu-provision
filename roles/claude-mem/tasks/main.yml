---
# REMOVAL role. claude-mem was removed from the whole fleet on 2026-10-23, data included, at
# Frank's request (coding-agent DECISIONS Q599): the nightly dreamer and the Agent Memory Repos
# already do its job. This role now ensures claude-mem is ABSENT, so a host that missed the
# sweep converges on its next play. Delete this role once every host has run it.

- name: Look for claude-mem's marketplace clone and data
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ claude_mem_marketplace }}"
    - "{{ claude_mem_dir }}"
  register: claude_mem_present

# Its own uninstaller stops the worker and removes the plugin, the marketplace, the plugin
# cache and ledger entries, and its Codex, opencode, OpenClaw, Hermes, Pi and OMP wiring. With
# stdin not a TTY it skips its confirm prompt. It keeps ~/.claude-mem and never touches Gemini;
# the steps below cover both.
- name: Run claude-mem's own uninstaller
  ansible.builtin.shell: npx -y claude-mem uninstall < /dev/null
  when: claude_mem_present.results | selectattr('stat.exists') | list | length > 0
  changed_when: true

# The worker can outlive the uninstaller's shutdown request, and chroma-mcp is its child.
- name: Stop any claude-mem worker that is left
  ansible.builtin.command: pkill -f 'claude-mem/[^ ]*/worker-service|\.claude-mem/chroma'
  register: claude_mem_pkill
  changed_when: claude_mem_pkill.rc == 0
  failed_when: claude_mem_pkill.rc > 1

- name: Strip the claude-mem wiring the uninstaller leaves
  ansible.builtin.command:
    cmd: python3 {{ role_path }}/files/strip-claude-mem.py
  register: claude_mem_strip
  changed_when: claude_mem_strip.stdout != "[]"
  when: not ansible_check_mode

- name: Delete claude-mem's data and leftover folders
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ claude_mem_leftovers }}"

- name: Look for anything claude-mem left behind
  ansible.builtin.shell: |
    grep -ls claude-mem {{ claude_mem_config_files | join(' ') }}
    for p in {{ claude_mem_leftovers | join(' ') }}; do [ -e "$p" ] && echo "$p"; done
    pgrep -fl 'claude-mem/[^ ]*/worker-service'
    true
  register: claude_mem_left
  changed_when: false
  check_mode: false

- name: Fail if claude-mem is not fully gone
  ansible.builtin.fail:
    msg: "claude-mem is still present: {{ claude_mem_left.stdout_lines }}"
  when: claude_mem_left.stdout | length > 0 and not ansible_check_mode
