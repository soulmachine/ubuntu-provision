---
- name: Install uv # noqa: command-instead-of-module risky-shell-pipe
  ansible.builtin.shell: curl -LsSf https://astral.sh/uv/install.sh | sh
  args:
    creates: "{{ lookup('env', 'HOME') }}/.local/bin/uv"

# Replaces the completions the oh-my-zsh uv plugin used to provide.
- name: Add uv shell completions to .bashrc
  ansible.builtin.lineinfile:
    path: "{{ lookup('env', 'HOME') }}/.bashrc"
    line: 'eval "$(uv generate-shell-completion bash)"'
    regexp: 'uv generate-shell-completion bash'
