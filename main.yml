  become: false
  roles:
    - apt
    - github
    - shell
    - omarchy
    - direnv
    - dotenv
    - uv
    - python
    - mise
    - go
    - nodejs
    - bun
    - rust
    - jdk
    - claude-code
    - codex
    - opencode
    - skills
    - playwright
    - playwright-cli
    - claude-mem
    - role: paseo
      tags: [agent-multiplexer]
    - cloudflare
    - multica-cli
    - tailscale
    - role: zellij
      tags: [terminal-multiplexer]
    - role: tmux
      tags: [terminal-multiplexer]
    - role: herdr
      tags: [terminal-multiplexer]
